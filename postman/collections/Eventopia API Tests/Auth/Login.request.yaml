$kind: http-request
name: Login
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{userEmail}}",
      "password": "Test@1234"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has tokens", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("accessToken");
          pm.expect(json).to.have.property("refreshToken");
          pm.expect(json).to.have.property("user");
      });

      pm.test("Save tokens", function () {
          const json = pm.response.json();
          pm.collectionVariables.set("accessToken", json.accessToken);
          pm.collectionVariables.set("refreshToken", json.refreshToken);
      });
    language: text/javascript
