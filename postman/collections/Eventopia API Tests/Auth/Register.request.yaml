$kind: http-request
name: Register
method: POST
url: '{{baseUrl}}/auth/register'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Test User Eventopia",
      "email": "testuser_{{$timestamp}}@example.com",
      "password": "Test@1234",
      "role": "ORGANIZER"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has tokens and user", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json).to.have.property("user");
          pm.expect(json).to.have.property("accessToken");
          pm.expect(json).to.have.property("refreshToken");
      });

      pm.test("User has correct structure", function () {
          const user = pm.response.json().user;
          pm.expect(user).to.have.property("id");
          pm.expect(user).to.have.property("email");
          pm.expect(user).to.have.property("fullName");
          pm.expect(user).to.have.property("role");
      });

      pm.test("Save tokens and user data", function () {
          const json = pm.response.json();
          pm.collectionVariables.set("accessToken", json.accessToken);
          pm.collectionVariables.set("refreshToken", json.refreshToken);
          pm.collectionVariables.set("userId", json.user.id);
          pm.collectionVariables.set("userEmail", json.user.email);
      });
    language: text/javascript
