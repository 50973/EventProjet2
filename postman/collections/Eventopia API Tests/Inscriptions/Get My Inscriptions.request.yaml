$kind: http-request
name: Get My Inscriptions
method: GET
url: '{{baseUrl}}/inscriptions/me'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is an array or has inscriptions", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("object");
      });
    language: text/javascript
