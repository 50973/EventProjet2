$kind: http-request
name: Get Inscription by ID
method: GET
url: '{{baseUrl}}/inscriptions/{{inscriptionId}}'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has inscription details", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("inscription");
          const inscription = json.inscription;
          pm.expect(inscription.id).to.eql(pm.collectionVariables.get("inscriptionId"));
      });
    language: text/javascript
