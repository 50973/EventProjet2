$kind: http-request
name: Delete Category
method: DELETE
url: '{{baseUrl}}/api/categories/{{categoryId2}}'
order: 9000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 204", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });

      pm.test("Log response for category deletion behavior", function () {
          console.log("Delete Category Response Status:", pm.response.code);
          if (pm.response.text()) {
              console.log("Delete Category Response Body:", pm.response.text());
          }
      });
    language: text/javascript
