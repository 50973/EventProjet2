$kind: http-request
name: Create Category Without Admin - 403
method: POST
url: '{{baseUrl}}/api/categories'
order: 3000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{userToken}}'
body:
  type: json
  content: |-
    {
      "name": "Test Forbidden"
    }
scripts:
  - type: afterResponse
    code: |-
      // This request uses {{userToken}} (a non-admin token) instead of
      // {{accessToken}} (admin token) to verify that only admins can create categories.
      pm.test("Status code is 403 (Forbidden)", function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
